
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>سوبرماركت أبو عارف الفرا</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --navy: #1A2580;
  --navy2: #2d3ea8;
  --red: #C62828;
  --gold: #E8A000;
  --cream: #F4F1EA;
  --white: #FFFFFF;
  --text-dark: #1A2580;
  --text-mid: #444;
  --text-light: #888;
  --green: #2e7d32;
  --shadow-sm: 0 2px 8px rgba(0,0,0,0.08);
  --shadow-md: 0 6px 20px rgba(0,0,0,0.12);
  --shadow-lg: 0 12px 32px rgba(0,0,0,0.15);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Cairo', sans-serif;
  background: var(--cream);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  background-image: repeating-linear-gradient(135deg, transparent, transparent 18px, rgba(26,37,128,0.035) 18px, rgba(26,37,128,0.035) 20px);
}
.phone-wrap {
  width: 100%;
  max-width: 430px;
  position: relative;
  background: var(--cream);
  background-image: repeating-linear-gradient(135deg, transparent, transparent 18px, rgba(26,37,128,0.035) 18px, rgba(26,37,128,0.035) 20px);
}
.screen { display: none; min-height: 100vh; flex-direction: column; }
.screen.active { display: flex; }

/* == SCREEN 1 == */
.hero {
  position: relative;
  width: 100vw;
  left: 50%;
  right: 50%;
  margin-left: -50vw;
  margin-right: -50vw;
  height: 290px;
  background: linear-gradient(135deg, rgba(26,37,128,0.35) 0%, rgba(26,37,128,0.3) 100%),
              url('photo-1542838132-92c53300491e.jpg') center/cover no-repeat;
  background-size: cover;
  overflow: hidden;
  flex-shrink: 0;
}
.hero-circles {
  position: absolute; inset: 0;
}
.hero-circles::before {
  content: '';
  position: absolute;
  width: 400px; height: 400px; border-radius: 50%;
  background: rgba(255,193,7,0.05);
  top: -100px; right: -80px;
}
.hero-circles::after {
  content: '';
  position: absolute;
  width: 180px; height: 180px; border-radius: 50%;
  background: rgba(198,40,40,0.04);
  bottom: -50px; left: -30px;
}
.hero-arch {
  position: absolute; bottom: -1px; left: 0; right: 0;
}
.logo-card {
  position: absolute;
  top: 55%;
  left: 50%;
  transform: translate(-50%, -62%);
  background: #fff;
  border-radius: 28px;
  padding: 14px 18px 10px;
  box-shadow: 0 12px 32px rgba(0,0,0,0.15), 0 0 40px rgba(26,37,128,0.15);
  display: flex;
  flex-direction: column;
  align-items: center;
  min-width: 160px;
  backdrop-filter: blur(8px);
  border: 1px solid rgba(255,255,255,0.8);
}
.logo-img { width: 118px; height: 118px; object-fit: contain; }

.main-body {
  flex: 1;
  padding: 88px 20px 0;
  display: flex;
  flex-direction: column;
  align-items: center;
}
.welcome-title {
  font-size: 23px;
  font-weight: 900;
  color: var(--navy);
  text-align: center;
  margin-bottom: 8px;
  letter-spacing: -0.3px;
}
.datetime-row {
  display: flex;
  align-items: center;
  gap: 12px;
  color: var(--text-light);
  font-size: 12.5px;
  font-weight: 600;
  margin-bottom: 16px;
  direction: ltr;
}
.datetime-sep { width: 1px; height: 13px; background: #ccc; }
.ornament {
  display: flex; align-items: center; gap: 10px;
  width: 100%; margin-bottom: 20px;
}
.orn-line { flex: 1; height: 1.5px; background: linear-gradient(90deg, transparent, #c8c0a8, transparent); }
.orn-icon { color: var(--red); font-size: 16px; }

.btn-primary {
  width: 100%;
  background: linear-gradient(135deg, var(--navy) 0%, var(--navy2) 100%);
  color: #fff;
  border: none; border-radius: 20px;
  padding: 0 18px; height: 62px;
  display: flex; align-items: center; justify-content: space-between;
  cursor: pointer; margin-bottom: 12px;
  box-shadow: 0 6px 20px rgba(0,0,0,0.12), 0 0 20px rgba(26,37,128,0.2);
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  font-family: 'Cairo', sans-serif;
  position: relative;
  overflow: hidden;
}
.btn-primary:hover { 
  transform: translateY(-3px); 
  box-shadow: 0 12px 32px rgba(0,0,0,0.15), 0 0 30px rgba(26,37,128,0.3);
}
.btn-primary:active { transform: scale(0.97); box-shadow: 0 2px 8px rgba(0,0,0,0.08); }

.btn-secondary {
  width: 100%;
  background: #fff;
  color: var(--navy);
  border: 1.5px solid #e0e0e0; border-radius: 20px;
  padding: 0 18px; height: 62px;
  display: flex; align-items: center; justify-content: space-between;
  cursor: pointer; margin-bottom: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  font-family: 'Cairo', sans-serif;
  position: relative;
}
.btn-secondary:hover { 
  transform: translateY(-3px);
  border-color: #d0d0d0;
  box-shadow: 0 6px 20px rgba(0,0,0,0.12);
  background: #fafafa;
}
.btn-secondary:active { transform: scale(0.97); }

.btn-label { font-size: 17px; font-weight: 800; letter-spacing: 0.2px; }
.btn-icon-box {
  width: 40px; height: 40px; border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  background: rgba(255,255,255,0.18);
}
.btn-secondary .btn-icon-box { background: #f0f2fa; }

.features { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; width: 100%; margin-top: 22px; }
.feat { display: flex; flex-direction: column; align-items: center; gap: 7px; }
.feat-icon {
  width: 52px; height: 52px; border-radius: 16px;
  background: linear-gradient(135deg, #fff, #f9fafb);
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  border: 1px solid rgba(26,37,128,0.05);
  transition: all 0.3s ease;
}
.feat:hover .feat-icon {
  transform: translateY(-4px);
  box-shadow: 0 6px 20px rgba(0,0,0,0.12);
}
.feat-label { font-size: 11.5px; font-weight: 700; color: var(--text-mid); text-align: center; }

.footer {
  text-align: center; color: var(--text-light);
  font-size: 12px; font-weight: 600;
  padding: 24px 0 20px; margin-top: auto;
}

/* == SCREEN 2 - LOADING == */
.loading-wrap {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 36px;
}
.dots { position: relative; width: 68px; height: 68px; }
.dot {
  position: absolute; width: 18px; height: 18px; border-radius: 50%;
}
.d1 { background: var(--navy); top: 8px; right: 0; animation: pulse 1.2s ease-in-out infinite 0s; }
.d2 { background: var(--gold); top: 0; right: 22px; animation: pulse 1.2s ease-in-out infinite 0.3s; }
.d3 { background: var(--red); bottom: 8px; left: 0; animation: pulse 1.2s ease-in-out infinite 0.6s; }
.d4 { background: var(--navy); bottom: 0; right: 10px; animation: pulse 1.2s ease-in-out infinite 0.9s; }
@keyframes pulse {
  0%, 100% { transform: scale(1); opacity: 1; }
  50% { transform: scale(0.45); opacity: 0.4; }
}
.loading-text { font-size: 17px; font-weight: 700; color: var(--text-mid); display: flex; align-items: center; gap: 8px; }
.cd-num { color: var(--gold); font-size: 22px; font-weight: 900; }

/* == SCREEN 3 - STATUS == */
.status-body {
  flex: 1; padding: 50px 20px 24px;
  display: flex; flex-direction: column; align-items: center;
}
.status-icon-wrap {
  width: 80px; height: 80px; border-radius: 50%;
  background: linear-gradient(135deg, #e8ecfc, #c0cbf5);
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 14px;
  box-shadow: 0 12px 32px rgba(26,37,128,0.18), 0 0 30px rgba(26,37,128,0.15);
  border: 2px solid rgba(255,255,255,0.7);
}
.status-greeting { font-size: 15.5px; font-weight: 700; color: var(--navy); text-align: center; margin-bottom: 8px; word-break: break-all; max-width: 290px; }
.connected-badge {
  background: #e8f5e9; color: #2e7d32;
  font-size: 13px; font-weight: 700;
  padding: 5px 20px; border-radius: 20px; margin-bottom: 26px;
}
.info-card {
  width: 100%; background: #fff; border-radius: 22px;
  overflow: hidden; box-shadow: 0 6px 20px rgba(0,0,0,0.12);
  margin-bottom: 22px;
  border: 1px solid rgba(26,37,128,0.05);
  transition: all 0.3s ease;
}
.info-card:hover {
  box-shadow: 0 12px 32px rgba(0,0,0,0.15);
  transform: translateY(-2px);
}
.info-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 18px;
  border-bottom: 1px dashed #eee;
}
.info-row:last-child { border-bottom: none; }
.info-lbl { display: flex; align-items: center; gap: 10px; color: var(--text-mid); font-size: 13.5px; font-weight: 600; }
.info-lbl-icon {
  width: 34px; height: 34px; border-radius: 10px;
  background: linear-gradient(135deg, #f0f2fa, #e8ecfc);
  display: flex; align-items: center; justify-content: center;
}
.info-val { color: var(--navy); font-size: 13.5px; font-weight: 800; direction: ltr; }

.btn-logout {
  width: 100%;
  background: linear-gradient(135deg, var(--navy), var(--navy2));
  color: #fff; border: none; border-radius: 18px;
  padding: 18px; display: flex; align-items: center; justify-content: center; gap: 10px;
  cursor: pointer; font-family: 'Cairo', sans-serif;
  font-size: 17px; font-weight: 800;
  box-shadow: 0 6px 22px rgba(26,37,128,0.3);
  transition: transform .15s;
}
.btn-logout:active { transform: scale(0.98); }

/* == SCREEN 4 - LOGOUT SUCCESS == */
.success-body {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center; padding: 28px;
}
.success-icon {
  width: 90px; height: 90px; border-radius: 50%;
  background: linear-gradient(135deg, #fce4ec, #f8bbd0);
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 26px;
  box-shadow: 0 12px 32px rgba(198,40,40,0.18), 0 0 35px rgba(198,40,40,0.15);
  border: 2px solid rgba(255,255,255,0.7);
}
.success-title { font-size: 22px; font-weight: 900; color: var(--navy); text-align: center; margin-bottom: 36px; }
.btn-back {
  width: 100%;
  background: linear-gradient(135deg, var(--navy), var(--navy2));
  color: #fff; border: none; border-radius: 18px;
  padding: 18px; display: flex; align-items: center; justify-content: center; gap: 10px;
  cursor: pointer; font-family: 'Cairo', sans-serif;
  font-size: 17px; font-weight: 800;
  box-shadow: 0 6px 22px rgba(26,37,128,0.3);
  transition: transform .15s;
}
.btn-back:active { transform: scale(0.98); }

/* DEMO NAV */
.demo-nav {
  position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%);
  background: rgba(26,37,128,0.92);
  border-radius: 30px; padding: 8px 14px;
  display: flex; gap: 6px; z-index: 999;
  backdrop-filter: blur(10px);
  box-shadow: 0 4px 20px rgba(0,0,0,0.25);
}
.dnav-btn {
  background: rgba(255,255,255,0.14);
  border: none; color: rgba(255,255,255,0.85);
  font-size: 11px; font-family: 'Cairo', sans-serif; font-weight: 700;
  padding: 6px 12px; border-radius: 20px; cursor: pointer;
  transition: all .2s; white-space: nowrap;
}
.dnav-btn.on { background: rgba(255,255,255,0.92); color: var(--navy); }
</style>
</head>

<script>
  var cdTimer = null;

  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    if (cdTimer) { clearInterval(cdTimer); cdTimer = null; }
  }

  function setActive(id) {
    document.querySelectorAll('.dnav-btn').forEach(b => b.classList.remove('on'));
    document.getElementById(id).classList.add('on');
  }

  function showLoading() {
    showScreen('s2');
    setActive('nb2');
    var cnt = 3;
    document.getElementById('countdown').textContent = cnt;
    cdTimer = setInterval(function() {
      cnt--;
      document.getElementById('countdown').textContent = cnt;
      if (cnt <= 0) {
        clearInterval(cdTimer); cdTimer = null;
        showScreen('s3'); setActive('nb3');
        startStatusTimer();
      }
    }, 1000);
  }

  function showLogout() {
    showScreen('s4'); setActive('nb4');
  }

  var statusSecs = 10;
  var statusTimer = null;
  function startStatusTimer() {
    if (statusTimer) clearInterval(statusTimer);
    statusSecs = 10;
    var remaining = 170;
    updateStatus(statusSecs, remaining);
    statusTimer = setInterval(function() {
      statusSecs++;
      remaining = Math.max(0, remaining - 1);
      updateStatus(statusSecs, remaining);
    }, 1000);
  }

  function updateStatus(secs, rem) {
    var mins = Math.floor(rem / 60);
    var sec = rem % 60;
    document.getElementById('uptime-disp').textContent = secs + 's';
    document.getElementById('time-left').textContent = mins > 0 ? mins + 'm' + sec + 's' : sec + 's';
  }

  // Clock update
  function updateClock() {
    var now = new Date();
    var days = ['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
    var months = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
    var h = now.getHours(), m = now.getMinutes();
    var ampm = h >= 12 ? 'م' : 'ص';
    h = h % 12; if (h === 0) h = 12;
    var mStr = m < 10 ? '0' + m : '' + m;
    document.getElementById('s1-date').textContent = days[now.getDay()] + ' ' + now.getDate() + ' ' + months[now.getMonth()] + ' ' + now.getFullYear();
    document.getElementById('s1-time').textContent = h + ':' + mStr + ' ' + ampm;
  }
  updateClock();
  setInterval(updateClock, 30000);
</script>
